- id: smc_pad_main_104
  alias: 'SMC-PAD Note104「廊」: 廊下電球 トグル'
  description: SMC-PAD 通常ページ Note 104(オーバーレイ「廊」)
  triggers:
  - trigger: event
    event_type: smc_pad_event
    event_data:
      type: note_on
      note: 104
  conditions: []
  actions:
  - action: light.toggle
    target:
      entity_id: light.smart_bulb_light
  mode: single
- id: smc_pad_main_100
  alias: 'SMC-PAD Note100「錠」: セサミ鍵 施錠/解錠'
  description: SMC-PAD 通常ページ Note 100(オーバーレイ「錠」)
  triggers:
  - trigger: event
    event_type: smc_pad_event
    event_data:
      type: note_on
      note: 100
  conditions: []
  actions:
  - if:
    - condition: state
      entity_id: lock.sesami_5_pro
      state: locked
    then:
    - action: lock.unlock
      target:
        entity_id: lock.sesami_5_pro
    else:
    - action: lock.lock
      target:
        entity_id: lock.sesami_5_pro
  mode: single
- id: smc_pad_knob_30
  alias: 'SMC-PAD ノブ CC30: トイレ電球 明るさ'
  description: SMC-PAD ノブ(CC30)で トイレ電球 明るさ。間引きは midi.py 側(0.25秒)
  triggers:
  - trigger: event
    event_type: smc_pad_event
    event_data:
      type: control_change
      note: 30
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.value | int == 0 }}'
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.e27_led_lamp1
    default:
    - action: light.turn_on
      target:
        entity_id: light.e27_led_lamp1
      data:
        brightness_pct: '{{ [1, ((trigger.event.data.value | int / 127) ** 2 * 100)
          | round | int] | max }}'
  mode: restart
- id: smc_pad_knob_39
  alias: 'SMC-PAD ノブ CC39: 和室ファン 弱/中/強(段階が変わった時だけ赤外線送信)'
  description: SMC-PAD ノブ(CC39)で 和室ファン 弱/中/強(段階が変わった時だけ赤外線送信)。間引きは midi.py 側(0.25秒)
  triggers:
  - trigger: event
    event_type: smc_pad_event
    event_data:
      type: control_change
      note: 39
  conditions: []
  actions:
  - variables:
      level: '{{ ''Weak'' if trigger.event.data.value | int <= 42 else (''Medium''
        if trigger.event.data.value | int <= 84 else ''Strong'') }}'
  - condition: template
    value_template: '{{ level != states(''input_select.fan_scene_helper'') or is_state(''input_boolean.fan_state_helper'',''off'')
      }}'
  - action: input_select.select_option
    target:
      entity_id: input_select.fan_scene_helper
    data:
      option: '{{ level }}'
  - action: scene.turn_on
    target:
      entity_id: '{{ {''Weak'':''scene.wa_fan_low'',''Medium'':''scene.wa_fan_mid'',''Strong'':''scene.wa_fan_high''}[level]
        }}'
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.fan_state_helper
  mode: restart
